name: Codex Auto-Fix on CI Failure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-auto-fix-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && !startsWith(github.event.workflow_run.head_branch, 'codex/auto-fix-') }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAILED_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
      FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Skip when OPENAI_API_KEY is missing
        id: check-key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; skipping Codex auto-fix workflow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout failing ref
        if: steps.check-key.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FAILED_HEAD_SHA }}
          fetch-depth: 0

      - name: Setup Python
        if: steps.check-key.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.check-key.outputs.skip != 'true'
        run: pip install -e ".[dev,api]"

      - name: Run Codex
        if: steps.check-key.outputs.skip != 'true'
        uses: openai/codex-action@v1.6
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            You are working in a Python project with ruff and pytest checks.
            Read the repository and reproduce CI failures.
            Make the minimal safe change needed to pass CI.
            Do not refactor unrelated code.
            Keep edits small and focused.
          codex_args: '["--config","sandbox_mode=\"workspace-write\""]'

      - name: Verify lint
        if: steps.check-key.outputs.skip != 'true'
        run: ruff check src tests

      - name: Verify tests
        if: steps.check-key.outputs.skip != 'true'
        run: pytest -q

      - name: Check for changes
        if: steps.check-key.outputs.skip != 'true' && success()
        id: check-changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request with fixes
        if: steps.check-key.outputs.skip != 'true' && success() && steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix(ci): auto-fix failing checks via Codex"
          branch: codex/auto-fix-${{ github.event.workflow_run.run_id }}
          base: ${{ env.FAILED_HEAD_BRANCH }}
          title: "Auto-fix failing CI via Codex"
          body: |
            Codex generated this PR after a CI failure on `${{ env.FAILED_WORKFLOW_NAME }}`.
            Failed run: ${{ env.FAILED_RUN_URL }}
            Base branch: `${{ env.FAILED_HEAD_BRANCH }}`
            Scope: minimal changes to make CI pass.
