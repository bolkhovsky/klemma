name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bump version
        run: python scripts/bump_version.py ${{ github.event.inputs.bump }}

      - name: Commit, tag, and push
        run: |
          NEW_VERSION=$(python -c 'import re; print(re.search(r"version = .(.+?).", open("pyproject.toml").read()).group(1))')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/klemma/__init__.py
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push
          git push --tags
