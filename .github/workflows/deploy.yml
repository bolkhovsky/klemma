name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

# Only one deploy at a time
concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t klemma-api:${{ github.sha }} \
            -t klemma-api:latest \
            -f saas/deploy/Dockerfile \
            .

      - name: Save Docker image
        run: docker save klemma-api:latest | gzip > klemma-api.tar.gz

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_PORT="${VPS_SSH_PORT:-2222}"
          SSH_OPTS="-i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new"
          SCP_OPTS="-i ~/.ssh/deploy_key -P $SSH_PORT -o StrictHostKeyChecking=accept-new"

          # Transfer image
          scp $SCP_OPTS klemma-api.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/"

          # Transfer compose files
          scp $SCP_OPTS -r saas/deploy/ "${VPS_USER}@${VPS_HOST}:/opt/klemma/"

          # Deploy on VPS
          ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" << 'DEPLOY_SCRIPT'
            set -e
            cd /opt/klemma/deploy

            # Load new image
            sudo docker load < /tmp/klemma-api.tar.gz
            rm /tmp/klemma-api.tar.gz

            # Pull latest Redis/Caddy images
            sudo docker compose pull redis caddy

            # Restart with new image
            sudo docker compose up -d --force-recreate api worker
            sudo docker compose up -d

            # Verify health
            sleep 5
            curl -sf http://localhost/health || exit 1
            echo "Deploy successful"
          DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
