name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.claude/**'

env:
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}

# Only one deploy at a time
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: [ci]
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v6

      # Build frontend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: saas/dashboard/package-lock.json
      - name: Build frontend
        run: cd saas/dashboard && npm ci && npm run build

      # Build Docker image (with layer caching)
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: saas/deploy/Dockerfile
          tags: klemma-api:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save klemma-api:latest | gzip > klemma-api.tar.gz

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SSH_PORT="${VPS_SSH_PORT:-2222}"
          SSH_OPTS="-i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new"
          SCP_OPTS="-i ~/.ssh/deploy_key -P $SSH_PORT -o StrictHostKeyChecking=accept-new"

          # Transfer image
          scp $SCP_OPTS klemma-api.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/"

          # Transfer compose files
          scp $SCP_OPTS -r saas/deploy/ "${VPS_USER}@${VPS_HOST}:/opt/klemma/"

          # Ship ONLY this repo's own site file into the shared sites.d.
          # This directory lives outside /opt/klemma/, so the scp above cannot
          # reach it — that is the whole point: a klemma deploy must never be
          # able to delete another project's vhost again (см. b9ca8ac, где так
          # уронили rfm и miz).
          ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" "sudo mkdir -p /opt/caddy/sites.d"
          scp $SCP_OPTS saas/deploy/sites.d/litresearch.ru.conf "${VPS_USER}@${VPS_HOST}:/tmp/"
          ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" "sudo mv /tmp/litresearch.ru.conf /opt/caddy/sites.d/"

          # Backup current dashboard BEFORE uploading new one (so rollback has the old version)
          ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" "\
            [ -d /opt/klemma/dashboard ] && \
              rm -rf /opt/klemma/dashboard.previous && \
              cp -r /opt/klemma/dashboard /opt/klemma/dashboard.previous || true"

          # Transfer built dashboard (contents of dist/, not the dir itself)
          ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" "mkdir -p /opt/klemma/dashboard"
          scp $SCP_OPTS -r saas/dashboard/dist/* "${VPS_USER}@${VPS_HOST}:/opt/klemma/dashboard/"

          # Deploy on VPS with rollback support. Capture ssh exit code —
          # the remote script prints DEPLOY_OK on success, which we then grep.
          # Wrap ssh with `timeout` as a safety net: sudo/docker child processes
          # on the remote can keep the ssh channel open even after `exit 0`,
          # which would otherwise hang the job indefinitely. 10 min is plenty
          # for image load + compose restart + health check on a 2-vCPU VPS.
          set +e
          timeout --signal=KILL 600 ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" > /tmp/deploy.out 2>&1 << 'DEPLOY_SCRIPT'
            set -e
            cd /opt/klemma/deploy

            # Backup Docker image for rollback
            docker image inspect klemma-api:latest >/dev/null 2>&1 && \
              docker tag klemma-api:latest klemma-api:previous || true

            # Backup SQLite databases from named volume via temporary container
            # Resolve actual volume name (compose prefixes with project name)
            DATA_VOLUME=$(docker volume ls -q --filter "name=klemma-data" | head -1)
            sudo rm -rf /opt/klemma/db-backup
            mkdir -p /opt/klemma/db-backup
            if [ -n "$DATA_VOLUME" ]; then
              docker run --rm \
                -v "$DATA_VOLUME":/data:ro \
                -v /opt/klemma/db-backup:/backup \
                alpine sh -c "find /data -name '*.db' -exec cp {} /backup/ \;" 2>/dev/null || true
            fi

            # Load new image
            sudo docker load < /tmp/klemma-api.tar.gz
            rm /tmp/klemma-api.tar.gz

            # Restart services. Redirect stdin/stdout/stderr on the docker
            # compose calls so sudo child processes don't inherit the ssh
            # session's channel and hold it open after we `exit 0`.
            sudo docker compose pull --quiet redis caddy </dev/null
            sudo docker compose up -d --force-recreate api worker </dev/null
            sudo docker compose up -d </dev/null

            # --- Caddy: проверить конфиг ДО применения, затем применить ---
            # Валидируем копию нового файла внутри контейнера: import
            # /etc/caddy/sites.d/*.conf должен резолвиться там же, где будет
            # работать. Невалидный конфиг обязан уронить деплой здесь, а не
            # после reload, когда сайты уже лежат.
            sudo docker cp /opt/klemma/deploy/Caddyfile deploy-caddy-1:/tmp/Caddyfile.new
            sudo docker exec deploy-caddy-1 \
              caddy validate --config /tmp/Caddyfile.new --adapter caddyfile
            sudo docker exec deploy-caddy-1 rm -f /tmp/Caddyfile.new

            # /etc/caddy/Caddyfile — bind mount ОДНОГО файла: scp выше заменил
            # инод на хосте, поэтому контейнер может продолжать видеть старый
            # файл, и reload перечитает именно его. Сравниваем и пересоздаём
            # контейнер только при расхождении — иначе лишний обрыв TLS на
            # каждом деплое. Каталог sites.d смонтирован как КАТАЛОГ, файлы
            # внутри видны сразу, для них достаточно reload.
            HOST_SUM=$(sudo md5sum /opt/klemma/deploy/Caddyfile | cut -d' ' -f1)
            CTR_SUM=$(sudo docker exec deploy-caddy-1 md5sum /etc/caddy/Caddyfile | cut -d' ' -f1)
            if [ "$HOST_SUM" != "$CTR_SUM" ]; then
              echo "Caddyfile изменился — пересоздаю контейнер caddy"
              sudo docker compose up -d --force-recreate caddy </dev/null
              sleep 3
            else
              sudo docker exec deploy-caddy-1 \
                caddy reload --config /etc/caddy/Caddyfile </dev/null
            fi

            # Сначала дождаться, пока api сам объявит себя здоровым.
            # `docker compose up -d` возвращается раньше готовности приложения,
            # а healthcheck в compose имеет interval 30s — то есть в первые
            # полминуты контейнер заведомо ещё не healthy, и запрос через Caddy
            # получил бы 502. Прежняя проверка этого не замечала, потому что
            # била в порт 80 и довольствовалась 308-редиректом; когда её
            # заменили на содержательную, коротких 15 секунд не хватило и
            # деплой откатился на здоровом приложении (run 30461939404).
            API_CID=$(sudo docker compose ps -q api)
            API_STATE=unknown
            for _ in $(seq 1 30); do
              API_STATE=$(sudo docker inspect "$API_CID" \
                --format '{{.State.Health.Status}}' 2>/dev/null || echo unknown)
              [ "$API_STATE" = "healthy" ] && break
              sleep 5
            done
            echo "api health: $API_STATE"

            # Health check with retries (5 attempts, 3s apart).
            # ВАЖНО: проверяем по РЕАЛЬНОМУ хосту и утверждаем содержимое
            # ответа. Прежняя проверка `curl -sf http://localhost/health` была
            # пустышкой: порт 80 отдаёт 308-редирект на любой хост, включая
            # несуществующий, а `curl -sf` считает 3xx успехом — то есть гейт
            # не мог провалиться даже при нуле настроенных сайтов.
            for i in 1 2 3 4 5; do
              sleep 3
              if curl -sf --max-time 10 https://litresearch.ru/api/health \
                   | grep -q '"status":"ok"'; then
                echo ""
                echo "Deploy successful (attempt $i)"
                # Что сейчас лежит в общем каталоге сайтов. Список не зашит в
                # деплой намеренно: klemma больше не владеет чужими vhost'ами
                # и не должна знать про них. Это строка для человека в логе —
                # если сосед пропал, это видно сразу.
                echo "Caddy sites.d:"
                ls -1 /opt/caddy/sites.d/ 2>/dev/null | sed 's/^/  /' || echo "  (пусто!)"
                # Clean up previous backups — all failures silenced
                {
                  sudo docker image rm klemma-api:previous
                  sudo rm -rf /opt/klemma/dashboard.previous
                  sudo rm -rf /opt/klemma/db-backup
                } >/dev/null 2>&1 || true
                # Pull BGE-M3 model into Ollama in background (idempotent,
                # ~1.8GB on first run — must not block SSH session)
                nohup sudo docker compose exec -T ollama ollama pull bge-m3 \
                  </dev/null >/dev/null 2>&1 &
                echo "DEPLOY_OK"
                exit 0
              fi
              echo "Health check attempt $i failed..."
            done

            # ROLLBACK
            echo "ROLLING BACK"
            docker tag klemma-api:previous klemma-api:latest 2>/dev/null || true
            [ -d /opt/klemma/dashboard.previous ] && \
              rm -rf /opt/klemma/dashboard && \
              mv /opt/klemma/dashboard.previous /opt/klemma/dashboard
            # Restore SQLite databases into named volume
            DATA_VOLUME=$(docker volume ls -q --filter "name=klemma-data" | head -1)
            if [ -d /opt/klemma/db-backup ] && [ -n "$DATA_VOLUME" ]; then
              docker run --rm \
                -v "$DATA_VOLUME":/data \
                -v /opt/klemma/db-backup:/backup:ro \
                alpine sh -c "for db in /backup/*.db; do [ -f \"\$db\" ] && cp \"\$db\" /data/; done"
            fi
            sudo docker compose up -d --force-recreate api worker
            sleep 5
            curl -sf http://localhost/health || echo "WARNING: rollback also failed"
            exit 1
          DEPLOY_SCRIPT
          SSH_EXIT=$?
          set -e

          # Show remote output
          cat /tmp/deploy.out

          # Success is determined by DEPLOY_OK marker, not ssh exit code —
          # ssh sometimes returns non-zero (or hangs, which timeout kills as
          # exit 137) even after remote `exit 0`, due to sudo/docker child
          # processes holding the channel open. Marker in stdout is truth.
          if grep -q "^DEPLOY_OK$" /tmp/deploy.out; then
            echo "Deploy marker found — success (ssh exit was $SSH_EXIT)"
            exit 0
          fi
          echo "Deploy marker missing — ssh exit code was $SSH_EXIT"
          exit 1

      - name: Notify deploy result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          STATUS="${{ job.status }}"
          SHA="${{ github.sha }}"
          if [ "$STATUS" = "success" ]; then
            MSG="Klemma deployed to ${DEPLOY_ENV} (${SHA:0:7})"
          else
            MSG="Deploy FAILED (${DEPLOY_ENV}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" -d text="$MSG"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
