# =============================================================================
# KLEMMA CONFIGURATION — Example
# =============================================================================
# Copy to ~/.klemma/config.yaml and customize for your project.
# See: https://github.com/bolkhovsky/klemma
#
# NOTE: Content fields (chapters, scientific_results, title, etc.) go in
# KLEMMA.md frontmatter, NOT here. This file is for infrastructure only.

instance:
  name: "my-dissertation"
  type: "academic"

zotero:
  library_id: "YOUR_LIBRARY_ID"       # Zotero library ID (from Settings → Feeds/API)
  library_type: "user"                 # "user" or "group"
  api_key_env: "ZOTERO_API_KEY"        # env var holding your Zotero API key
  local: false
  library_json: "/path/to/your/bibtex-export.json"  # BetterBibTeX JSON export
  storage_path: "/path/to/Zotero/storage"            # Zotero attachment storage

obsidian:
  vault_path: "/path/to/your/obsidian/vault"
  notes_folder: "References"           # folder with @citekey.md notes
  tags_folder: "Tags"                  # optional folder for tag notes
  use_cli: null

ai:
  language: "ru"                       # AI response language: "en", "ru", "de", etc.
  max_pdf_chars: 50000
  timeout: 300
  retries: 2

  # ===========================================================================
  # Choose ONE backend preset below. Uncomment the one you need.
  # ===========================================================================

  # --- Preset 1: Claude Max subscription (no API key needed) -----------------
  # Uses Claude Code CLI. Simplest setup, but no per-task model routing.
  # Works with: `claude` CLI installed + active Max subscription.
  backend: "claude"
  model: "opus"                        # "opus" or "sonnet" (only these two)

  # --- Preset 2: Anthropic API via LiteLLM (ANTHROPIC_API_KEY required) ------
  # Full model routing support. Set key in ~/.klemmarc.yaml or env var.
  # backend: "litellm"
  # model: "anthropic/claude-sonnet-4-6"
  # task_classes:                       # per-task model routing (opt-in):
  #   planner: "haiku"                  #   daily plans — fast & cheap
  #   extract: "sonnet"                 #   fragment extraction — accuracy
  #   annotate: "sonnet"                #   vault note annotation
  #   research: "opus"                  #   research briefings — highest quality
  #   outline_initial: "opus"
  #   outline_incremental: "opus"
  #   library_status: "sonnet"
  #   library_recommend: "opus"
  #   library_audit: "opus"
  #   library_prune: "sonnet"
  #   ask: "opus"
  # class_model_map:
  #   litellm:
  #     opus: "anthropic/claude-opus-4-6"
  #     sonnet: "anthropic/claude-sonnet-4-6"
  #     haiku: "anthropic/claude-haiku-4-5-20251001"

  # --- Preset 3: OpenAI API via LiteLLM (OPENAI_API_KEY required) -----------
  # backend: "litellm"
  # model: "openai/gpt-4.1"
  # task_classes:
  #   planner: "mini"
  #   research: "gpt4"
  # class_model_map:
  #   litellm:
  #     gpt4: "openai/gpt-4.1"
  #     mini: "openai/gpt-4.1-mini"

  # --- Preset 4: Local models via Ollama -------------------------------------
  # backend: "litellm"
  # model: "ollama/llama3"
  # base_url: "http://localhost:11434"

embeddings:
  # --- LiteLLM + Ollama (recommended, single-billing) ------------------------
  # Free, offline, strong on Russian. Keeps Anthropic as the only paid vendor.
  # Setup (one-time): `ollama pull bge-m3`  (~1.2 GB, 1024-dim, 8k context)
  backend: "litellm"
  model: "ollama/bge-m3"
  base_url: "http://localhost:11434"
  # dim: 1024                          # optional; auto-detected on first call

  # --- Alternatives (uncomment one) ------------------------------------------
  # backend: "openai"
  # model: "text-embedding-3-small"
  # api_key_env: "OPENAI_API_KEY"
  #
  # backend: "s2"                      # Semantic Scholar free API (768d, English-centric)
  #
  # backend: "local"                   # sentence-transformers, no Ollama needed
  # model: "allenai/specter2"

state:
  db_path: "./data/klemma.db"          # relative to ~/.klemma/ or absolute

# DEPRECATED: dissertation: section — use KLEMMA.md frontmatter instead.
# Run 'klemma migrate' to move content fields to KLEMMA.md.
# dissertation:
#   title: "Your dissertation title"
#   chapters: ...

processing:
  batch_size: 2
  skip_no_pdf: true
  min_pdf_length: 500

tags:
  auto_mapping:
    # Map keywords to tags for automatic classification:
    - pattern: "review|survey|meta.?analysis"
      tag: "Review"
    - pattern: "dataset|benchmark|open data"
      tag: "Dataset"
    - pattern: "methodology|method"
      tag: "Methodology"
    - pattern: "machine learning|deep learning|neural network"
      tag: "Machine Learning"
    - pattern: "statistical|regression|correlation"
      tag: "Statistics"

export:
  output_dir: "./exports"
  pandoc:
    timeout: 300
    number_sections: true

mcp:
  servers: {}
  # Example: add MCP servers for external search
  # servers:
  #   zotero:
  #     command: "uvx"
  #     args: ["zotero-mcp"]
  #     env:
  #       ZOTERO_LOCAL: "true"
