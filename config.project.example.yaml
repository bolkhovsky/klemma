# =============================================================================
# KLEMMA PROJECT CONFIG — per-project infrastructure settings
# =============================================================================
# This file lives in .klemma/config.yaml inside your project directory.
# Content fields (chapters, scientific_results, etc.) go in KLEMMA.md frontmatter.
# Shared resources (obsidian, zotero, ai) are inherited from parent
# project if this is a nested project. Override only what you need.

# --- Shared resources (inherited from parent if nested) ---

# Zotero (optional — enables auto-discovery of BBT citekeys).
# zotero:
#   library_json: "/path/to/your/bibtex-export.json"  # BetterBibTeX JSON export
#   storage_path: "/path/to/Zotero/storage"            # Zotero attachment storage

# Obsidian override (optional — only for power users who read annotated
# @citekey.md notes inside an Obsidian vault). When unset, klemma writes
# annotated notes and raw PDF sidecars to `.klemma/notes/` and
# `.klemma/pdfs/` inside the project directory.
# obsidian:
#   vault_path: "/path/to/your/obsidian/vault"
#   notes_folder: "References"           # folder with @citekey.md notes
#   tags_folder: "Tags"                  # optional folder for tag notes

ai:
  language: "ru"                       # AI response language

  # --- Claude Max (no API key) -----------------------------------------------
  backend: "claude"
  model: "opus"                        # "opus" or "sonnet" only

  # --- Anthropic API via LiteLLM ---------------------------------------------
  # backend: "litellm"
  # model: "anthropic/claude-sonnet-4-6"
  # task_classes:
  #   planner: "haiku"
  #   research: "opus"
  # class_model_map:
  #   litellm:
  #     opus: "anthropic/claude-opus-4-6"
  #     sonnet: "anthropic/claude-sonnet-4-6"
  #     haiku: "anthropic/claude-haiku-4-5-20251001"

# --- Per-project infrastructure (NOT inherited from parent) ---

state:
  db_path: "./data/klemma.db"          # relative to .klemma/

tags:
  auto_mapping:
    - pattern: "review|survey|meta.?analysis"
      tag: "Review"
    - pattern: "methodology|method"
      tag: "Methodology"
