# =============================================================================
# KLEMMA GLOBAL CONFIG — ~/.klemmarc.yaml
# =============================================================================
# Single config file for all klemma projects. Overridden by project configs.
# This file should have 0600 permissions because it may contain API keys.
#
# Merge order (later wins):
# ~/.klemmarc.yaml < ~/.klemma/config.yaml < parent project < child project < CLI
#
# Install klemma with LiteLLM support:
#   pip install klemma[litellm]

# --- AI backend ---
# Choose ONE backend preset.

ai:
  language: "ru"
  timeout: 300
  retries: 2

  # --- Claude Max (no API key, no model routing) ----------------------------
  backend: "claude"
  model: "opus"                         # "opus" or "sonnet" only

  # --- Anthropic API via LiteLLM (with model routing) -----------------------
  # backend: "litellm"
  # model: "anthropic/claude-sonnet-4-6"
  # task_classes:
  #   planner: "haiku"
  #   research: "opus"
  # class_model_map:
  #   litellm:
  #     opus: "anthropic/claude-opus-4-6"
  #     sonnet: "anthropic/claude-sonnet-4-6"
  #     haiku: "anthropic/claude-haiku-4-5-20251001"

  # --- OpenAI API via LiteLLM -----------------------------------------------
  # backend: "litellm"
  # model: "openai/gpt-4.1"

  # --- Local (Ollama / vLLM) ------------------------------------------------
  # backend: "litellm"
  # model: "ollama/llama3"
  # base_url: "http://localhost:11434"

# --- API keys ---
# Direct keys — no env var juggling. Only uncomment what you use.

# api_keys:
#   anthropic: "sk-ant-..."
#   openai: "sk-..."
#   google: "AIza..."

