[project]
name = "klemma-cli"
version = "0.1.0"
description = "Lightweight sync client for Klemma SaaS — git-native file sync + library transfer"
requires-python = ">=3.11"
readme = {text = "Lightweight sync client for Klemma SaaS", content-type = "text/plain"}
license = {text = "Polyform-Noncommercial-1.0.0"}
authors = [{name = "Ilya Bolkhovskiy"}]
keywords = ["academic", "research", "sync", "git"]
dependencies = [
    "click==8.1.8",
    "requests==2.32.3",
    "pydantic==2.11.10",
    "PyYAML==6.0.2",
]

[project.scripts]
klemma-cli = "klemma_cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klemma_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
