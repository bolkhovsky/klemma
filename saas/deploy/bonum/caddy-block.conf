# Append this block to the SHARED live Caddyfile (/opt/klemma/deploy/Caddyfile)
# — same pattern as the rfm.bolkhovsky.ru / miz.bolkhovsky.ru blocks — then reload:
#   docker exec deploy-caddy-1 caddy reload --config /etc/caddy/Caddyfile
# Requires: A-record bonum-analytics.bolkhovsky.ru → 82.146.38.192, and the
# bonum-portal container joined to deploy_default (it is, via the compose file).

# bonum-analytics — meeting-analytics portal (project: bonum). Container bonum-portal
bonum-analytics.bolkhovsky.ru {
	reverse_proxy bonum-portal:8000 {
		header_up X-Real-IP {remote_host}
		header_up X-Forwarded-For {remote_host}
		header_up X-Forwarded-Proto {scheme}
	}

	header {
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		-Server
	}
}
