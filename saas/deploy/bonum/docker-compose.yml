# Bonum meeting-analytics portal — separate stack on the klemma VPS.
# Reuses the shared infra: deploy_default network (→ Ollama bge-m3) and the
# shared deploy-caddy reverse proxy (add the site block from caddy-block.conf).
# Own data volume → meeting DB + accounts isolated from the klemma SaaS.
services:
  bonum-portal:
    image: bonum-portal:latest
    container_name: bonum-portal
    build:
      context: ../../..
      dockerfile: saas/deploy/bonum/Dockerfile
    environment:
      - KLEMMA_ENV=production
      - KLEMMA_DATA_DIR=/data/saas
      - KLEMMA_BONUM_PROJECT_ROOT=/data/meetings
      - KLEMMA_PROMPTS_DIR=/app/prompts
      - KLEMMA_SERVE_SPA=/app/dashboard
      - KLEMMA_JWT_SECRET=${KLEMMA_JWT_SECRET}
      - KLEMMA_BONUM_INGEST_TOKEN=${KLEMMA_BONUM_INGEST_TOKEN}
      # Nodul sites-collection webhook (POST /meetings/sites/sync fallback URL).
      - KLEMMA_BONUM_SITES_WEBHOOK=${KLEMMA_BONUM_SITES_WEBHOOK:-}
      # LLM for /ask — Anthropic Haiku via the shared VPN egress proxy (geoblock).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KLEMMA_BONUM_AI_MODEL=${KLEMMA_BONUM_AI_MODEL:-anthropic/claude-haiku-4-5-20251001}
      # Embeddings — reuse the shared Ollama (no second model/container).
      - KLEMMA_EMBEDDINGS_BACKEND=litellm
      - KLEMMA_EMBEDDINGS_MODEL=ollama/bge-m3
      - KLEMMA_EMBEDDINGS_BASE_URL=http://ollama:11434
      # Anthropic egress via host tinyproxy (same as klemma api/worker);
      # intra-network hosts bypass the proxy.
      - HTTP_PROXY=${KLEMMA_EGRESS_PROXY-http://172.17.0.1:8888}
      - HTTPS_PROXY=${KLEMMA_EGRESS_PROXY-http://172.17.0.1:8888}
      - NO_PROXY=localhost,127.0.0.1,ollama,deploy-ollama-1
    volumes:
      - bonum-data:/data
    networks:
      - default
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # The shared network created by the klemma compose project (deploy_default),
  # where deploy-ollama-1 and deploy-caddy-1 live.
  default:
    external: true
    name: deploy_default

volumes:
  bonum-data:
