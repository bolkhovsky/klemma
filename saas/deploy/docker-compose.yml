services:
  api:
    image: klemma-api:latest
    build:
      context: ../..
      dockerfile: saas/deploy/Dockerfile
    environment:
      - KLEMMA_ENV=production
      - KLEMMA_DATA_DIR=/data/klemma
      - KLEMMA_PROMPTS_DIR=/app/prompts
      - KLEMMA_JWT_SECRET=${KLEMMA_JWT_SECRET}
      - KLEMMA_CORS_ORIGINS=${KLEMMA_CORS_ORIGINS:-}
      - REDIS_URL=redis://redis:6379
      # AI credentials — api process makes LLM calls directly in the
      # GET /library/recommendations path (curated ranker). Was previously
      # worker-only when all AI work ran as rq jobs (#332).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - KLEMMA_AI_MODEL=${KLEMMA_AI_MODEL:-anthropic/claude-sonnet-4-20250514}
      # Embeddings — validated at startup by _validate_embeddings_config().
      # API process doesn't embed directly but must pass the same config check
      # as the worker so misconfigurations are caught before any job runs.
      - KLEMMA_EMBEDDINGS_BACKEND=${KLEMMA_EMBEDDINGS_BACKEND:-litellm}
      - KLEMMA_EMBEDDINGS_MODEL=${KLEMMA_EMBEDDINGS_MODEL:-ollama/bge-m3}
      - KLEMMA_EMBEDDINGS_BASE_URL=${KLEMMA_EMBEDDINGS_BASE_URL:-http://ollama:11434}
      # Host-side tinyproxy on 172.17.0.1:8888 routes egress via OpenVPN tun0 so
      # Anthropic/OpenAI calls originate from an allowed region. Intra-compose
      # hostnames are exempt so Redis/Ollama/self traffic stays on the bridge.
      # Single-dash form: empty KLEMMA_EGRESS_PROXY overrides the default
      # (needed for local dev without VPN).
      - HTTP_PROXY=${KLEMMA_EGRESS_PROXY-http://172.17.0.1:8888}
      - HTTPS_PROXY=${KLEMMA_EGRESS_PROXY-http://172.17.0.1:8888}
      - NO_PROXY=localhost,127.0.0.1,redis,ollama,api,worker
    volumes:
      - klemma-data:/data/klemma
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: klemma-api:latest
    build:
      context: ../..
      dockerfile: saas/deploy/Dockerfile
    command: ["python", "-m", "klemma.api.worker"]
    environment:
      - KLEMMA_DATA_DIR=/data/klemma
      - KLEMMA_PROMPTS_DIR=/app/prompts
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - KLEMMA_AI_MODEL=${KLEMMA_AI_MODEL:-anthropic/claude-sonnet-4-20250514}
      # Embeddings (Ollama/BGE-M3 via LiteLLM — runs inside Docker network)
      - KLEMMA_EMBEDDINGS_BACKEND=${KLEMMA_EMBEDDINGS_BACKEND:-litellm}
      - KLEMMA_EMBEDDINGS_MODEL=${KLEMMA_EMBEDDINGS_MODEL:-ollama/bge-m3}
      - KLEMMA_EMBEDDINGS_BASE_URL=${KLEMMA_EMBEDDINGS_BASE_URL:-http://ollama:11434}
      # Same egress proxy as the api service — AI calls from the worker must
      # also exit through the VPN tunnel.
      # Single-dash form: empty KLEMMA_EGRESS_PROXY overrides the default
      # (needed for local dev without VPN).
      - HTTP_PROXY=${KLEMMA_EGRESS_PROXY-http://172.17.0.1:8888}
      - HTTPS_PROXY=${KLEMMA_EGRESS_PROXY-http://172.17.0.1:8888}
      - NO_PROXY=localhost,127.0.0.1,redis,ollama,api,worker
    volumes:
      - klemma-data:/data/klemma
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3g
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dashboard:/srv/dashboard:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  klemma-data:
  redis-data:
  ollama-data:
  caddy-data:
  caddy-config:
