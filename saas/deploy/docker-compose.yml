services:
  api:
    image: klemma-api:latest
    build:
      context: ../..
      dockerfile: saas/deploy/Dockerfile
    environment:
      - KLEMMA_ENV=production
      - KLEMMA_DATA_DIR=/data/klemma
      - KLEMMA_PROMPTS_DIR=/app/prompts
      - KLEMMA_JWT_SECRET=${KLEMMA_JWT_SECRET}
      - KLEMMA_CORS_ORIGINS=${KLEMMA_CORS_ORIGINS:-}
      - REDIS_URL=redis://redis:6379
    volumes:
      - klemma-data:/data/klemma
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: klemma-api:latest
    build:
      context: ../..
      dockerfile: saas/deploy/Dockerfile
    command: ["python", "-m", "klemma.api.worker"]
    environment:
      - KLEMMA_DATA_DIR=/data/klemma
      - KLEMMA_PROMPTS_DIR=/app/prompts
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - KLEMMA_AI_MODEL=${KLEMMA_AI_MODEL:-anthropic/claude-sonnet-4-20250514}
    volumes:
      - klemma-data:/data/klemma
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dashboard:/srv/dashboard:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  klemma-data:
  redis-data:
  caddy-data:
  caddy-config:
