# klemma.bolkhovsky.ru — личный портал Meeting Intelligence (Илья).
# Отдельный от клиентского bonum-analytics: свой контейнер и том.
# Требует A-записи klemma.bolkhovsky.ru → 82.146.38.192.
klemma.bolkhovsky.ru {
	# Раздача APK мобильного клиента (путь с секретным сегментом).
	handle_path /apk/* {
		# Каталог /opt/klemma/dashboard уже смонтирован в контейнер Caddy
		# как /srv/dashboard — другого пути к диску хоста у него нет.
		#
		# ЗАВИСИМОСТЬ: этот mount принадлежит compose-проекту klemma
		# (saas/deploy/docker-compose.yml, сервис caddy). То есть раздача APK
		# коммерческого контура держится на каталоге научного продукта.
		# Развязать при переезде портала в отдельный репозиторий: новый
		# контейнер должен раздавать APK сам.
		root * /srv/dashboard/apk
		file_server
	}

	reverse_proxy klemma-mi-portal:8000 {
		header_up X-Real-IP {remote_host}
		header_up X-Forwarded-For {remote_host}
		header_up X-Forwarded-Proto {scheme}
	}

	header {
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		-Server
	}
}
