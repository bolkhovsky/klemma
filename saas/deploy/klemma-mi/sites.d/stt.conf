# stt.bolkhovsky.ru — домашний STT-воркер (fram) через обратный SSH-туннель.
# Туннель поднимает сам fram: -R 172.18.0.1:18080:127.0.0.1:8080.
# Если дома пропал свет или интернет — 502; мобильный клиент держит запись
# в офлайн-очереди и повторит позже, это штатное поведение.
stt.bolkhovsky.ru {
	# Записи совещаний: час аудио ≈ 60–85 МБ, лимит воркера ~100 МБ.
	# Этот лимит — первая линия защиты от предавторизационной загрузки:
	# Caddy обрывает тело до того, как оно дойдёт до воркера.
	request_body {
		max_size 120MB
	}

	# 172.18.0.1 — шлюз сети deploy_default (адрес хоста со стороны контейнера).
	# 127.0.0.1 здесь означал бы сам контейнер Caddy, а не хост.
	reverse_proxy 172.18.0.1:18080 {
		header_up X-Real-IP {remote_host}
		header_up X-Forwarded-For {remote_host}
		# Обработка идёт на CPU: час записи ≈ 14 минут. Ответ на загрузку
		# приходит сразу (201), но таймауты поднимаем с запасом.
		transport http {
			read_timeout 600s
			write_timeout 600s
		}
	}

	header {
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		-Server
	}
}
