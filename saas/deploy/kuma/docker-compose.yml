# uptime-kuma — уровень 1 мониторинга (C3): статусы приложений на VPS.
#
# Не ловит смерть самого VPS/сети/Caddy — во всех этих случаях kuma умирает
# вместе с хостом. Уровень 2 (проба с fram) живёт в klemma-stt/deploy/fram/.
# Оговорка, выясненная 01.08.2026: канал уведомлений уровня 2 тоже упирается в
# эту машину — egress с fram к Telegram идёт SSH-туннелем до неё же. Подробности
# — README.md рядом и докстринг monitor-probe.py.
#
# Сеть deploy_default (та же, что у остальных сайтов) — иначе общему Caddy
# нечем достучаться до контейнера по имени. Коллизии алиасов не будет: имя
# `uptime-kuma` уникально на этой сети (в отличие от generic `api`, который
# делили deploy-api-1 и rfm-admin-api-1 — см. фикс litresearch.ru 30.07.2026).
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    environment:
      # api.telegram.org с этой машины напрямую не отвечает (01.08.2026: curl
      # напрямую → 000, через локальный tinyproxy → 302). Без прокси kuma
      # исправно ловила бы отказы и молчала о них — ровно тот дефект, который
      # у пробы с fram пришлось чинить отдельно (klemma-stt #22).
      HTTP_PROXY: http://172.18.0.1:8888
      HTTPS_PROXY: http://172.18.0.1:8888
      # Мониторы обязаны ходить к целям НАПРЯМУЮ: через прокси они проверяли бы
      # контур маршрутом, которым не ходит ни один пользователь, и отказ витрины
      # или Caddy мог бы выглядеть здоровым. Тот же довод, что для NO_PROXY на
      # fram (klemma-stt/deploy/fram/env.monitor.example).
      NO_PROXY: .bolkhovsky.ru,litresearch.ru,localhost,127.0.0.1
    volumes:
      - kuma-data:/app/data
    networks:
      - default
    expose:
      - "3001"
    restart: unless-stopped

networks:
  default:
    external: true
    name: deploy_default

volumes:
  kuma-data:
