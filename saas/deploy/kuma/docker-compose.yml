# uptime-kuma — мониторинг контура (C3): статусы приложений на VPS.
#
# Не ловит смерть самого VPS/сети/Caddy — во всех этих случаях kuma умирает
# вместе с хостом. Второго уровня больше нет: проба с fram удалена 23.08.2026,
# её канал уведомлений упирался в эту же машину (egress с fram к Telegram шёл
# SSH-туннелем до неё), то есть независимой она не была. Подробности — README.md
# рядом.
#
# Сеть deploy_default (та же, что у остальных сайтов) — иначе общему Caddy
# нечем достучаться до контейнера по имени. Коллизии алиасов не будет: имя
# `uptime-kuma` уникально на этой сети (в отличие от generic `api`, который
# делили deploy-api-1 и rfm-admin-api-1 — см. фикс litresearch.ru 30.07.2026).
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    # Прокси-переменных здесь СОЗНАТЕЛЬНО нет — они ломали отправку, см. tg-relay
    # ниже. Мониторы ходят к целям напрямую, как и должны.
    volumes:
      - kuma-data:/app/data
    networks:
      - default
    expose:
      - "3001"
    restart: unless-stopped

  # Единственный рабочий путь от kuma к Telegram на этой машине.
  #
  # api.telegram.org отсюда напрямую не отвечает (01.08.2026: curl → 000), а
  # прокси-переменные не помогают: kuma 1.23.17 хардкодит адрес
  # (server/notification-providers/telegram.js) и шлёт запрос через axios,
  # который для https-цели отправляет прокси АБСОЛЮТНЫЙ URI вместо CONNECT:
  #
  #   tinyproxy: Request (fd 5): POST https://api.telegram.org/... HTTP/1.1
  #   tinyproxy: read_buffer: read() failed on fd 6: Connection reset by peer
  #   kuma:      Error: Request failed with status code 502
  #
  # Поэтому не прокси, а TCP-проброс: socat принимает соединение и открывает
  # CONNECT-туннель сам. TLS остаётся сквозным до Telegram, сертификат
  # настоящий, MITM нет, код kuma не патчится.
  tg-relay:
    image: alpine/socat:1.8.0.3
    container_name: tg-relay
    command:
      - TCP-LISTEN:443,fork,reuseaddr
      - PROXY:172.18.0.1:api.telegram.org:443,proxyport=8888
    networks:
      default:
        aliases:
          # docker-DNS отдаёт этот контейнер вместо реального адреса — иначе
          # захардкоженный в kuma URL никак не перенаправить. Побочный эффект:
          # алиас действует на всю сеть deploy_default, то есть любой соседний
          # контейнер тоже пойдёт в Telegram через релей. Это не регресс —
          # напрямую оттуда всё равно не отвечает.
          - api.telegram.org
    restart: unless-stopped

networks:
  default:
    external: true
    name: deploy_default

volumes:
  kuma-data:
