# status.bolkhovsky.ru — uptime-kuma (C3). Владелец файла:
# репозиторий klemma, деплой .github/workflows/deploy.yml.
#
# Публичные status-страницы держать ВЫКЛЮЧЕННЫМИ в самой kuma (Settings →
# Status Pages): дашборд раскрывает всю топологию контура (какие сайты есть,
# как называются мониторы). Наружу — только страница входа.
status.bolkhovsky.ru {
	reverse_proxy uptime-kuma:3001 {
		header_up X-Real-IP {remote_host}
		header_up X-Forwarded-For {remote_host}
		header_up X-Forwarded-Proto {scheme}
	}

	header {
		X-Content-Type-Options nosniff
		X-Frame-Options DENY
		Referrer-Policy strict-origin-when-cross-origin
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		-Server
	}
}
