# litresearch.ru — научная Клемма (LitResearch). Владелец файла: репозиторий
# klemma, деплой .github/workflows/deploy.yml. Не редактировать на сервере:
# следующий деплой перезапишет.
litresearch.ru {
	# API proxy — strip /api prefix. Full container name required: alias `api`
	# collides with rfm-admin-api-1 on deploy_default (both register it), so a
	# bare `api:8000` upstream can round-robin into RFM's container — same
	# collision already documented and worked around in rfm.conf. Verified live
	# 30.07.2026: Docker embedded DNS returned both IPs for `api`, and
	# litresearch.ru was intermittently serving RFM's SPA instead of the API.
	handle_path /api/* {
		reverse_proxy deploy-api-1:8000 {
			header_up X-Real-IP {remote_host}
			header_up X-Forwarded-For {remote_host}
			header_up X-Forwarded-Proto {scheme}
		}
	}

	# SPA static files
	handle {
		root * /srv/dashboard
		try_files {path} /index.html
		file_server
	}

	# Security headers
	header {
		X-Content-Type-Options nosniff
		X-Frame-Options DENY
		Referrer-Policy strict-origin-when-cross-origin
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		-Server
	}
}
