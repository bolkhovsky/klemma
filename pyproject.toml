[project]
name = "klemma"
version = "0.1.0"
description = "AI academic assistant template"
requires-python = ">=3.11"
readme = "CLAUDE.md"
license = {text = "MIT"}

dependencies = [
    "click==8.1.8",
    "pydantic==2.10.6",
    "PyMuPDF==1.25.3",
    "Jinja2==3.1.5",
    "PyYAML==6.0.2",
    "textual==1.0.0",
    "rich==13.9.4",
    "anthropic==0.49.0",
    "pyzotero==1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.8",
]

[project.scripts]
klemma = "klemma.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klemma"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
