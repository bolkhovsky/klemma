[project]
name = "klemma"
version = "0.14.0"
description = "AI-powered CLI assistant for PhD dissertation research — manages literature, extracts citations, generates plans"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Polyform-Noncommercial-1.0.0"}
authors = [{name = "Ilya Bolkhovskiy"}]
keywords = ["academic", "dissertation", "research", "zotero", "obsidian", "ai", "pdf", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: Free for non-commercial use",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click==8.1.8",
    "pydantic==2.11.10",
    "PyMuPDF==1.25.3",
    "Jinja2==3.1.6",
    "PyYAML==6.0.2",
    "rich==13.9.4",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.8",
]
openai = ["openai>=1.0"]
litellm = ["litellm>=1.40"]
embeddings = ["numpy>=1.24"]
local-embeddings = ["numpy>=1.24", "sentence-transformers>=2.2"]
docx = ["python-docx>=1.0"]
mcp = ["mcp>=1.0"]
api = [
    "fastapi==0.115.12",
    "uvicorn[standard]>=0.34",
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",
    "pydantic[email]>=2.0",
]
recommended = ["litellm>=1.40"]
all-ai = ["openai>=1.0", "litellm>=1.40"]

[project.scripts]
klemma = "klemma.cli:main"

[project.urls]
Homepage = "https://github.com/klemma-ai/klemma"
Repository = "https://github.com/klemma-ai/klemma"
"Bug Reports" = "https://github.com/klemma-ai/klemma/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klemma"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
